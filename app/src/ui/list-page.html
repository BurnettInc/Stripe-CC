  <style>
    /* ── Design tokens — mirror the dashboard (app/src/ui/dashboard.html) ── */
    :root {
      --bg: #F9FAFB;
      --card-bg: #FFFFFF;
      --text: #111827;
      --body: #4B5563;
      --muted: #6B7280;
      --border: #E5E7EB;
      --border-strong: #D1D5DB;
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --primary-lighter: #E0E7FF;
      --primary-hover: #4338CA;
      --danger: #EF4444;
      --danger-light: #FEF2F2;
      --success: #047857;
      --success-light: #ECFDF5;
      --warning: #B45309;
      --warning-light: #FFFBEB;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --badge-draft-bg: #DBEAFE; --badge-draft-text: #1E40AF;
      --badge-semi-bg: #FEF3C7;  --badge-semi-text: #92400E;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    .container {
      max-width: 1024px;
      margin: 0 auto;
      padding: 32px 24px 56px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand svg { height: 32px; width: auto; display: block; flex-shrink: 0; }
    .header-left h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--primary);
      line-height: 1.2;
      margin: 0;
    }
    .header-left p { color: var(--body); font-size: 0.85rem; margin-top: 4px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.85rem; font-weight: 600; color: var(--primary);
      text-decoration: none; padding: 6px 0;
    }
    .back-link:hover { color: var(--primary-hover); text-decoration: underline; }

    /* ── Summary chips (also filter tabs — <a> elements) ── */
    .summary-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
    .summary-chip {
      display: inline-flex; align-items: center;
      padding: 8px 16px; border-radius: 9999px;
      background: #fff; border: 1px solid var(--border-strong);
      font-size: 0.8rem; font-weight: 600; color: var(--body);
      text-decoration: none; white-space: nowrap;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }
    .summary-chip:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary-hover); }
    .summary-chip.selected {
      background: var(--primary); border-color: var(--primary); color: #fff;
    }
    .summary-chip.selected:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }

    /* ── Table card ── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    thead th {
      text-align: left; font-size: 0.7rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      background: var(--bg); white-space: nowrap;
    }
    /* Sortable headers: hover + ▲▼ indicator (client-side sort, vanilla JS) */
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--text); background: var(--primary-light); }
    .sort-indicator { display: inline-block; min-width: 0.9em; margin-left: 2px; font-size: 0.65rem; color: var(--primary); }
    tbody td { padding: 13px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--primary-light); }
    .cell-strong { font-weight: 600; color: var(--text); }
    .cell-muted { color: var(--muted); }
    .cell-amount { font-weight: 600; color: var(--text); white-space: nowrap; }

    /* ── Badges / chips ── */
    .chip {
      display: inline-block; padding: 3px 10px; border-radius: 9999px;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
      white-space: nowrap;
    }
    .chip-overdue { background: #FEE2E2; color: #991B1B; }
    .chip-sent { background: var(--success-light); color: var(--success); }
    .chip-stub { background: var(--warning-light); color: var(--warning); }
    .chip-stage { background: var(--badge-draft-bg); color: var(--badge-draft-text); }
    .chip-stage.st2 { background: var(--badge-semi-bg); color: var(--badge-semi-text); }
    .chip-stage.st3 { background: #FEE2E2; color: #991B1B; }
    /* Resend open/click engagement (migration 034): "Not opened" (neutral
       slate), "Opened" (blue), "Opened & clicked" (green). "No data" is the
       muted tone used for stub/legacy sends that were never tracked. */
    .chip-engagement { background: #F3F4F6; color: #4B5563; }
    .chip-engagement-opened { background: #DBEAFE; color: #1E40AF; }
    .chip-engagement-clicked { background: #ECFDF5; color: #047857; }
    .chip-engagement-none { background: #F3F4F6; color: #9CA3AF; }

    /* ── Pills — small inline row labels (e.g. "Test send" next to a name) ── */
    .pill {
      display: inline-block; padding: 2px 8px; margin-left: 6px;
      border-radius: 9999px; border: 1px solid var(--border);
      font-size: 0.62rem; font-weight: 600; letter-spacing: 0.3px;
      text-transform: uppercase; white-space: nowrap; vertical-align: middle;
    }
    .pill-muted { background: #F3F4F6; color: var(--muted); }
    .pill-manual { background: var(--primary-light); color: var(--primary-hover); border-color: var(--primary-lighter); }

    /* ── Email viewer on /reminders (expandable full sent content) ── */
    .cell-toggle { width: 1%; white-space: nowrap; }
    .email-toggle {
      display: inline-block; padding: 5px 12px; border-radius: 9999px;
      border: 1px solid var(--border-strong); background: #fff;
      font-size: 0.72rem; font-weight: 700; color: var(--primary);
      cursor: pointer; transition: background 0.12s ease, border-color 0.12s ease;
    }
    .email-toggle:hover { background: var(--primary-light); border-color: var(--primary); }
    .email-body {
      margin-top: 10px; padding: 12px 14px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      min-width: 420px;
    }
    .email-meta { margin-bottom: 10px; }
    .meta-row { display: flex; gap: 10px; font-size: 0.78rem; padding: 3px 0; }
    .meta-row dt { color: var(--muted); font-weight: 700; min-width: 74px; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.68rem; padding-top: 1px; }
    .meta-row dd { color: var(--text); word-break: break-all; }
    .email-pre {
      margin: 0; padding: 12px 14px;
      background: #fff; border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem; line-height: 1.55; color: var(--text);
      white-space: pre-wrap; word-break: break-word;
    }

    /* ── Stage override control on /past-due ── */
    .stage-cell { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .stage-override {
      padding: 5px 8px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong); background: #fff;
      font-size: 0.75rem; font-weight: 600; color: var(--body);
      cursor: pointer;
    }
    .stage-override:hover { border-color: var(--primary); }
    .stage-override.is-overridden { border-color: var(--primary); color: var(--primary-hover); }

    /* ── Test-send (stub) rows on /reminders are always hidden — the team's
       internal test sends must never be visible to merchants. The row-test
       marker class stays in the markup so the rows remain identifiable. ── */
    tr.row-test { display: none; }

    /* ── Empty state ── */
    .empty {
      padding: 48px 24px; text-align: center; color: var(--muted); font-size: 0.9rem;
    }
    .empty strong { color: var(--text); display: block; margin-bottom: 4px; font-size: 1rem; }

    /* ── Footer ── */
    .footer-note { text-align: center; margin-top: 24px; font-size: 0.75rem; color: var(--muted); }

  <script>
    // Client-side table sorting for the list pages. Sortable headers are
    // marked with data-sort-key; each row cell carries its raw sort value in
    // data-sort (server-rendered, so display text can stay humanized — e.g.
    // amounts keep currency formatting while the sort uses the cent value).
    // Clicking a header toggles asc/desc with a ▲▼ indicator. Lists are
    // capped at 200 rows server-side, so sorting in the DOM is fine — no
    // refetch. No-JS: headers are inert <th> elements, the server's default
    // order simply stands.
    (function () {
      "use strict";
      var state = { key: null, dir: "asc" };

      function cellValue(cell) {
        if (!cell) return null;
        var raw = cell.getAttribute("data-sort");
        return raw === null || raw === "" ? null : raw;
      }

      // Numeric values (amounts, day counts, stage, reminder counts) compare
      // as numbers; everything else (dates, subjects) as strings. ISO date
      // strings sort correctly lexicographically.
      function compareValues(a, b) {
        var an = parseFloat(a), bn = parseFloat(b);
        if (!isNaN(an) && !isNaN(bn)) return an - bn;
        return a < b ? -1 : a > b ? 1 : 0;
      }

      function sortTable(table, key, dir) {
        var headerRow = table.tHead ? table.tHead.rows[0] : null;
        var idx = -1;
        if (headerRow) {
          for (var i = 0; i < headerRow.cells.length; i++) {
            if (headerRow.cells[i].getAttribute("data-sort-key") === key) { idx = i; break; }
          }
        }
        var tbody = table.tBodies[0];
        if (idx < 0 || !tbody) return;
        var rows = Array.prototype.slice.call(tbody.rows);
        rows.sort(function (ra, rb) {
          var va = cellValue(ra.cells[idx]);
          var vb = cellValue(rb.cells[idx]);
          if (va === null && vb === null) return 0;
          if (va === null) return 1; // empty cells always sort last
          if (vb === null) return -1;
          var r = compareValues(va, vb);
          return dir === "asc" ? r : -r;
        });
        for (var j = 0; j < rows.length; j++) tbody.appendChild(rows[j]);
        // Update indicators + aria-sort on the header row.
        if (headerRow) {
          for (var k = 0; k < headerRow.cells.length; k++) {
            var th = headerRow.cells[k];
            var ind = th.querySelector(".sort-indicator");
            var isActive = th.getAttribute("data-sort-key") === key;
            if (ind) ind.textContent = isActive ? (dir === "asc" ? "\u25B2" : "\u25BC") : "";
            if (isActive) th.setAttribute("aria-sort", dir === "asc" ? "ascending" : "descending");
            else th.removeAttribute("aria-sort");
          }
        }
      }

      document.addEventListener("click", function (e) {
        var target = e.target;
        var th = target && target.closest ? target.closest("th[data-sort-key]") : null;
        if (!th) return;
        var table = th.closest("table");
        if (!table) return;
        var key = th.getAttribute("data-sort-key");
        if (state.key === key) state.dir = state.dir === "asc" ? "desc" : "asc";
        else { state.key = key; state.dir = "asc"; }
        sortTable(table, key, state.dir);
      });

      // Test-send (stub) rows on /reminders are hidden unconditionally by the
      // CSS rule `tr.row-test { display: none; }` above — there is no toggle,
      // and the hidden state survives the client-side sort because the rule
      // re-applies to the re-ordered rows.
    })();

    // Email viewer on /reminders: clicking "View email" toggles the hidden
    // detail panel (full subject / From / Reply-To / body with CAN-SPAM
    // footer) inside the same row, so the detail travels with the row during
    // client-side sorting.
    (function () {
      "use strict";
      document.addEventListener("click", function (e) {
        var btn = e.target && e.target.closest ? e.target.closest(".email-toggle") : null;
        if (!btn) return;
        var id = btn.getAttribute("data-id");
        if (!id) return;
        var panel = document.getElementById("emailbody-" + id);
        if (!panel) return;
        var open = panel.hidden;
        panel.hidden = !open;
        btn.setAttribute("aria-expanded", open ? "true" : "false");
        btn.textContent = open ? "Hide email" : "View email";
      });
    })();

    // Stage override control on /past-due: changing the per-row select saves
    // the manual override (or clears it to Auto) via the auth'd endpoint, then
    // reloads so the row reflects the new effective stage + manual indicator.
    (function () {
      "use strict";
      document.addEventListener("change", function (e) {
        var sel = e.target && e.target.closest ? e.target.closest(".stage-override") : null;
        if (!sel) return;
        var id = sel.getAttribute("data-invoice-id");
        if (!id) return;
        var stage = sel.value; // "" = Auto, "1"|"2"|"3" = manual override
        var prev = sel.getAttribute("data-saved") || "";
        if (stage === prev) return; // no-op re-select
        fetch("/invoices/" + id + "/stage", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ stage: stage === "" ? null : Number(stage) }),
        }).then(function (res) {
          if (res.ok) { window.location.reload(); }
          else { sel.value = prev; alert("Could not update the escalation stage."); }
        }).catch(function () {
          sel.value = prev;
          alert("Could not update the escalation stage.");
        });
      });
    })();
  </script>
</body>
</html>
